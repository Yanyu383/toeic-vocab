<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>單字記憶膠囊</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-slate-100 min-h-screen py-8 text-slate-800" x-data="vocabularyApp()">

    <div class="max-w-md mx-auto px-4">
        <!-- 標題 -->
        <h1 class="text-2xl font-bold text-center mb-6 text-slate-700">單字記憶膠囊</h1>

        <!-- API Key 設定區 -->
        <div class="bg-white p-4 rounded-xl shadow-sm mb-4 border border-slate-200">
            <label class="block text-sm font-medium text-slate-600 mb-2">🔑 Gemini API Key 設定：</label>
            <div class="flex gap-2">
                <input type="password" x-model="apiKey" placeholder="輸入 API Key..." class="flex-1 px-3 py-2 border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                <button @click="saveApiKey" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm transition">儲存 Key</button>
            </div>
        </div>

        <!-- GitHub 雲端同步設定區 -->
        <div class="bg-white p-4 rounded-xl shadow-sm mb-6 border border-slate-200" x-data="{ openGithubConfig: false }">
            <div @click="openGithubConfig = !openGithubConfig" class="flex justify-between items-center cursor-pointer">
                <label class="block text-sm font-medium text-slate-600 cursor-pointer">☁️ GitHub 雲端同步設定 (免匯出)</label>
                <span class="text-xs text-blue-600 font-medium" x-text="openGithubConfig ? '收合 ▲' : '展開 ▼'"></span>
            </div>
            
            <div class="mt-3 space-y-2.5" x-show="openGithubConfig">
                <input type="text" x-model="gh.owner" placeholder="GitHub 使用者名稱 (Owner)" class="w-full px-3 py-1.5 border rounded-lg text-xs focus:outline-none focus:ring-2 focus:ring-blue-500">
                <input type="text" x-model="gh.repo" placeholder="Repository 名稱 (例如: toeic-vocab)" class="w-full px-3 py-1.5 border rounded-lg text-xs focus:outline-none focus:ring-2 focus:ring-blue-500">
                <input type="text" x-model="gh.path" placeholder="檔案路徑 (例如: vocab.json)" class="w-full px-3 py-1.5 border rounded-lg text-xs focus:outline-none focus:ring-2 focus:ring-blue-500">
                <input type="password" x-model="gh.token" placeholder="GitHub Personal Access Token (PAT)" class="w-full px-3 py-1.5 border rounded-lg text-xs focus:outline-none focus:ring-2 focus:ring-blue-500">
                
                <div class="flex gap-2 pt-1">
                    <button @click="syncToGithub" class="flex-1 bg-purple-600 hover:bg-purple-700 text-white py-1.5 rounded text-xs font-medium transition">☁️ 推送至 GitHub</button>
                    <button @click="syncFromGithub" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white py-1.5 rounded text-xs font-medium transition">☁️ 從 GitHub 載入</button>
                </div>
            </div>
        </div>

        <!-- 頁籤導航 -->
        <div class="flex bg-slate-200 p-1 rounded-xl mb-6">
            <button @click="currentTab = 'add'" :class="currentTab === 'add' ? 'bg-white shadow-sm text-blue-600 font-medium' : 'text-slate-600'" class="flex-1 py-2 rounded-lg text-sm transition">✏️ 新增</button>
            <button @click="currentTab = 'list'" :class="currentTab === 'list' ? 'bg-white shadow-sm text-blue-600 font-medium' : 'text-slate-600'" class="flex-1 py-2 rounded-lg text-sm transition">📖 單字庫</button>
        </div>

        <!-- 新增單字頁面 -->
        <div x-show="currentTab === 'add'" class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
            <h2 class="font-bold text-lg mb-4 text-slate-700" x-text="isEditing ? '修改單字' : '新增單字'"></h2>
            
            <div class="mb-4">
                <label class="block text-sm font-medium text-slate-600 mb-1">英文單字 / 連接詞：</label>
                <input type="text" x-model="form.word" placeholder="例如: since" class="w-full px-3 py-2 border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <div class="mb-4">
                <label class="block text-sm font-medium text-slate-600 mb-1">整張單字卡的備註 / 補充說明：</label>
                <textarea x-model="form.note" placeholder="例如: 其實都有「自從」的意思..." class="w-full px-3 py-2 border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
            </div>

            <!-- 多種含意與用法列表 -->
            <div class="space-y-4 mb-4">
                <template x-for="(meaningItem, mIndex) in form.meanings" :key="mIndex">
                    <div class="p-3 border border-slate-200 rounded-lg bg-slate-50 relative space-y-3">
                        <div class="flex justify-between items-center">
                            <span class="text-xs font-bold text-slate-500" x-text="'含意 / 用法 #' + (mIndex + 1)"></span>
                            <button type="button" @click="removeMeaningField(mIndex)" x-show="form.meanings.length > 1" class="text-rose-500 hover:text-rose-700 text-xs">刪除此含意</button>
                        </div>

                        <div>
                            <label class="block text-xs font-medium text-slate-600 mb-1">詞性：</label>
                            <select x-model="meaningItem.pos" class="w-full px-3 py-1.5 border rounded-lg text-sm bg-white focus:outline-none focus:ring-2 focus:ring-blue-500">
                                <option value="conj. (連接詞)">conj. (連接詞)</option>
                                <option value="adv. (副詞)">adv. (副詞)</option>
                                <option value="v. (動詞)">v. (動詞)</option>
                                <option value="n. (名詞)">n. (名詞)</option>
                                <option value="adj. (形容詞)">adj. (形容詞)</option>
                                <option value="phr. (片語)">phr. (片語)</option>
                            </select>
                        </div>

                        <div>
                            <label class="block text-xs font-medium text-slate-600 mb-1">句子架構 / 文法公式：</label>
                            <textarea x-model="meaningItem.structure" rows="2" placeholder="例如: Since + 過去時間點 / 名詞短語, have/has + p.p" class="w-full px-3 py-2 border rounded-lg text-sm font-semibold focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
                        </div>

                        <div>
                            <label class="block text-xs font-medium text-slate-600 mb-1">中文解釋與補充：</label>
                            <input type="text" x-model="meaningItem.meaning" placeholder="例如: 子句的主詞與主要子句相同時..." class="w-full px-3 py-1.5 border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                        </div>

                        <!-- 該含意底下的多個例句列表 -->
                        <div class="space-y-3 border-t pt-3 border-slate-200">
                            <label class="block text-xs font-bold text-slate-600">例句列表：</label>
                            <template x-for="(ex, eIndex) in meaningItem.examples" :key="eIndex">
                                <div class="bg-white p-2.5 rounded border border-slate-200 relative space-y-2">
                                    <div class="flex justify-between items-center">
                                        <span class="text-[10px] font-medium text-slate-400" x-text="'例句 #' + (eIndex + 1)"></span>
                                        <button type="button" @click="removeExampleField(mIndex, eIndex)" x-show="meaningItem.examples.length > 1" class="text-rose-500 hover:text-rose-700 text-[10px]">刪除例句</button>
                                    </div>
                                    <input type="text" x-model="ex.en" placeholder="英文例句..." class="w-full px-2 py-1 border rounded text-xs focus:outline-none focus:ring-1 focus:ring-blue-500">
                                    <input type="text" x-model="ex.zh" placeholder="中文翻譯..." class="w-full px-2 py-1 border rounded text-xs focus:outline-none focus:ring-1 focus:ring-blue-500">
                                    <button type="button" @click="generateAiExample(mIndex, eIndex)" :disabled="isGenerating" class="w-full bg-emerald-600 hover:bg-emerald-700 disabled:bg-emerald-300 text-white py-1 rounded text-[11px] font-medium transition">
                                        <span x-show="!isGenerating">✨ 請 AI 產生此例句</span>
                                        <span x-show="isGenerating">思考中...</span>
                                    </button>
                                </div>
                            </template>

                            <!-- 新增例句按鈕 -->
                            <button type="button" @click="addExampleField(mIndex)" class="w-full border border-dashed border-emerald-400 text-emerald-600 hover:bg-emerald-50 py-1.5 rounded text-xs font-medium transition">
                                + 新增不同的例句
                            </button>
                        </div>
                    </div>
                </template>
            </div>

            <!-- 新增另一種意思按鈕 -->
            <button type="button" @click="addMeaningField" class="w-full border border-dashed border-blue-400 text-blue-600 hover:bg-blue-50 py-2 rounded-lg text-sm font-medium transition mb-4">
                + 新增這個單字的另一種意思 / 用法
            </button>

            <button @click="saveWord" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2.5 rounded-lg text-sm font-medium transition" x-text="isEditing ? '儲存修改' : '存入單字庫並記錄時間'"></button>
        </div>

        <!-- 單字庫頁面 -->
        <div x-show="currentTab === 'list'">
            <h2 class="font-bold text-lg mb-4 text-slate-700">我背過的單字</h2>
            
            <template x-for="(group, date) in groupedWords" :key="date">
                <div class="bg-white rounded-xl shadow-sm border border-slate-200 mb-4 overflow-hidden" x-data="{ openGroup: true }">
                    <div @click="openGroup = !openGroup" class="bg-slate-50 px-4 py-3 border-b border-slate-200 flex justify-between items-center cursor-pointer hover:bg-slate-100 transition">
                        <span class="text-sm font-medium text-slate-700" x-text="date + ' (' + group.length + ' 個項目)'"></span>
                        <span class="text-xs text-blue-600 font-medium" x-text="openGroup ? '收合日期 🔼' : '展開日期 🔽'"></span>
                    </div>

                    <div class="p-4 space-y-4" x-show="openGroup">
                        <template x-for="item in group" :key="item.id">
                            <div class="border border-slate-100 bg-slate-50/50 p-4 rounded-lg relative">
                                <div class="flex justify-between items-start mb-2">
                                    <h3 class="font-extrabold text-xl text-slate-900 tracking-wide" x-text="item.word"></h3>
                                    <div class="flex gap-1 items-center">
                                        <button @click="editWord(item)" class="bg-amber-500 hover:bg-amber-600 text-white px-2.5 py-1 rounded text-xs">修改</button>
                                        <button @click="deleteWord(item.id)" class="bg-rose-500 hover:bg-rose-600 text-white px-2.5 py-1 rounded text-xs">刪除</button>
                                    </div>
                                </div>
                                <p class="text-sm text-slate-600 mb-3 whitespace-pre-line leading-relaxed" x-show="item.note" x-text="'📝 備註：' + item.note"></p>
                                
                                <!-- 每一種用法為獨立卡片 -->
                                <div class="space-y-2">
                                    <template x-for="m in item.meanings">
                                        <div class="bg-white rounded border border-slate-200 text-sm overflow-hidden" x-data="{ openMeaning: false }">
                                            <div @click="openMeaning = !openMeaning" class="p-3 cursor-pointer hover:bg-slate-50 transition flex justify-between items-center">
                                                <div class="flex items-start gap-2.5 flex-1 pr-2">
                                                    <span class="text-[11px] font-medium px-2 py-0.5 rounded shrink-0 mt-0.5"
                                                          :class="{
                                                              'bg-blue-100 text-blue-700': m.pos.includes('連接詞'),
                                                              'bg-amber-100 text-amber-700': m.pos.includes('副詞'),
                                                              'bg-emerald-100 text-emerald-700': m.pos.includes('動詞'),
                                                              'bg-purple-100 text-purple-700': m.pos.includes('名詞'),
                                                              'bg-rose-100 text-rose-700': m.pos.includes('形容詞'),
                                                              'bg-indigo-100 text-indigo-700': m.pos.includes('片語')
                                                          }"
                                                          x-text="m.pos"></span>
                                                    
                                                    <div class="flex-1">
                                                        <span class="font-bold text-slate-900 text-base block whitespace-pre-line leading-snug" x-text="m.structure"></span>
                                                        <span class="text-xs text-slate-500 block mt-1 whitespace-pre-line" x-show="m.meaning" x-text="m.meaning"></span>
                                                    </div>
                                                </div>
                                                <span class="text-xs text-slate-400 font-bold px-1 shrink-0 self-center" x-text="openMeaning ? '▲' : '▼'"></span>
                                            </div>
                                            
                                            <!-- 展開後的該用法專屬例句區塊 -->
                                            <div class="space-y-2 border-t border-slate-100 bg-slate-50 p-3.5" x-show="openMeaning">
                                                <template x-for="ex in m.examples">
                                                    <div class="bg-white p-3 rounded-lg border border-slate-200 shadow-2xs space-y-1">
                                                        <p class="italic font-semibold text-slate-900 text-base leading-snug" x-text="ex.en"></p>
                                                        <p class="text-slate-600 text-sm leading-relaxed" x-text="ex.zh"></p>
                                                    </div>
                                                </template>
                                                <div x-show="!m.examples || m.examples.length === 0" class="text-xs text-slate-400 text-center py-1">
                                                    目前沒有例句
                                                </div>
                                            </div>
                                        </div>
                                    </template>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>
            </template>
            
            <div x-show="Object.keys(groupedWords).length === 0" class="text-center py-10 text-slate-400 text-sm">
                目前還沒有記錄任何項目，快去新增吧！
            </div>
        </div>

        <!-- 本地檔案備份與還原按鈕區 -->
        <div class="mt-8 pt-4 border-t border-slate-200 flex gap-2">
            <button @click="exportData" class="flex-1 bg-teal-700 hover:bg-teal-800 text-white py-2.5 px-3 rounded-lg text-xs font-medium transition flex items-center justify-center gap-1.5 shadow-sm">
                <span>📥 匯出資料備份</span>
            </button>
            <label class="flex-1 bg-amber-700 hover:bg-amber-800 text-white py-2.5 px-3 rounded-lg text-xs font-medium transition flex items-center justify-center gap-1.5 shadow-sm cursor-pointer">
                <span>📤 匯入備份檔案</span>
                <input type="file" accept=".json" @change="importData" class="hidden">
            </label>
        </div>

    </div>

    <!-- JavaScript 邏輯 -->
    <script>
        function vocabularyApp() {
            return {
                currentTab: 'list',
                apiKey: '',
                gh: {
                    owner: '',
                    repo: '',
                    path: 'vocab.json',
                    token: ''
                },
                isEditing: false,
                editId: null,
                isGenerating: false,
                form: {
                    word: '',
                    note: '',
                    meanings: [
                        { 
                            pos: 'conj. (連接詞)', 
                            structure: '', 
                            meaning: '',
                            examples: [{ en: '', zh: '' }] 
                        }
                    ]
                },
                words: [],

                init() {
                    const savedWords = localStorage.getItem('vocab_words');
                    if (savedWords) {
                        this.words = JSON.parse(savedWords);
                    }
                    const savedKey = localStorage.getItem('gemini_api_key');
                    if (savedKey) {
                        this.apiKey = savedKey;
                    }
                    // 載入 GitHub 設定
                    const savedGh = localStorage.getItem('github_sync_config');
                    if (savedGh) {
                        this.gh = JSON.parse(savedGh);
                    }
                },

                saveApiKey() {
                    localStorage.setItem('gemini_api_key', this.apiKey);
                    alert('API Key 儲存成功！');
                },

                saveGhConfig() {
                    localStorage.setItem('github_sync_config', JSON.stringify(this.gh));
                },

                async syncToGithub() {
                    this.saveGhConfig();
                    if (!this.gh.owner || !this.gh.repo || !this.gh.token) {
                        alert('請完整填寫 GitHub 帳號、Repo 名稱與 Token！');
                        return;
                    }

                    const apiUrl = `https://api.github.com/repos/${this.gh.owner}/${this.gh.repo}/contents/${this.gh.path}`;
                    const contentBase64 = btoa(unescape(encodeURIComponent(JSON.stringify(this.words, null, 2))));

                    try {
                        // 1. 先取得目前檔案的 SHA（GitHub 更新檔案需要帶上舊檔案的 SHA）
                        let sha = '';
                        const getRes = await fetch(apiUrl, {
                            headers: { 'Authorization': `Bearer ${this.gh.token}` }
                        });
                        if (getRes.ok) {
                            const fileData = await getRes.json();
                            sha = fileData.sha;
                        }

                        // 2. 進行 PUT 寫入更新
                        const bodyData = {
                            message: 'Sync vocab data from Web App',
                            content: contentBase64,
                            sha: sha ? sha : undefined
                        };

                        const putRes = await fetch(apiUrl, {
                            method: 'PUT',
                            headers: {
                                'Authorization': `Bearer ${this.gh.token}`,
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify(bodyData)
                        });

                        if (putRes.ok) {
                            alert('成功同步至 GitHub 雲端！');
                        } else {
                            const errJson = await putRes.json();
                            alert('同步失敗：' + (errJson.message || '未知錯誤'));
                        }
                    } catch (error) {
                        console.error(error);
                        alert('連線 GitHub API 發生錯誤。');
                    }
                },

                async syncFromGithub() {
                    this.saveGhConfig();
                    if (!this.gh.owner || !this.gh.repo || !this.gh.token) {
                        alert('請完整填寫 GitHub 帳號、Repo 名稱與 Token！');
                        return;
                    }

                    const apiUrl = `https://api.github.com/repos/${this.gh.owner}/${this.gh.repo}/contents/${this.gh.path}`;

                    try {
                        const res = await fetch(apiUrl, {
                            headers: { 'Authorization': `Bearer ${this.gh.token}` }
                        });

                        if (res.ok) {
                            const fileData = await res.json();
                            const decodedContent = decodeURIComponent(escape(atob(fileData.content)));
                            const remoteWords = JSON.parse(decodedContent);

                            if (Array.isArray(remoteWords)) {
                                if (confirm(`從 GitHub 成功讀取資料（共 ${remoteWords.length} 筆），是否覆蓋本地資料庫？`)) {
                                    this.words = remoteWords;
                                    this.syncStorage();
                                    alert('已成功從 GitHub 同步最新資料！');
                                }
                            }
                        } else {
                            alert('找不到遠端檔案或授權失敗，請確認路徑與 Token 是否正確。');
                        }
                    } catch (error) {
                        console.error(error);
                        alert('從 GitHub 載入資料發生錯誤。');
                    }
                },

                exportData() {
                    const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(this.words, null, 2));
                    const downloadAnchor = document.createElement('a');
                    downloadAnchor.setAttribute("href", dataStr);
                    downloadAnchor.setAttribute("download", `vocab_backup_${new Date().toISOString().split('T')[0]}.json`);
                    document.body.appendChild(downloadAnchor);
                    downloadAnchor.click();
                    downloadAnchor.remove();
                },

                importData(event) {
                    const file = event.target.files[0];
                    if (!file) return;

                    const reader = new FileReader();
                    reader.onload = (e) => {
                        try {
                            const importedWords = JSON.parse(e.target.result);
                            if (Array.isArray(importedWords)) {
                                if (confirm(`確定要匯入備份嗎？這將會覆蓋或合併目前的單字庫（共 ${importedWords.length} 筆資料）。`)) {
                                    this.words = importedWords;
                                    this.syncStorage();
                                    alert('資料匯入成功！');
                                }
                            } else {
                                alert('備份檔案格式有誤！');
                            }
                        } catch (error) {
                            console.error(error);
                            alert('解析 JSON 檔案失敗，請確認檔案是否正確。');
                        }
                        event.target.value = '';
                    };
                    reader.readAsText(file);
                },

                addMeaningField() {
                    this.form.meanings.push({ 
                        pos: 'adv. (副詞)', 
                        structure: '', 
                        meaning: '',
                        examples: [{ en: '', zh: '' }] 
                    });
                },

                removeMeaningField(index) {
                    this.form.meanings.splice(index, 1);
                },

                addExampleField(mIndex) {
                    this.form.meanings[mIndex].examples.push({ en: '', zh: '' });
                },

                removeExampleField(mIndex, eIndex) {
                    this.form.meanings[mIndex].examples.splice(eIndex, 1);
                },

                async generateAiExample(mIndex, eIndex) {
                    if (!this.apiKey.trim()) {
                        alert('請先在上方設定並儲存 Gemini API Key！');
                        return;
                    }
                    const targetMeaning = this.form.meanings[mIndex];
                    if (!this.form.word.trim() || (!targetMeaning.structure.trim() && !targetMeaning.meaning.trim())) {
                        alert('請先輸入單字與結構或中文解釋！');
                        return;
                    }

                    this.isGenerating = true;
                    const prompt = `請針對英文單字/連接詞 "${this.form.word}"（詞性：${targetMeaning.pos}，結構：${targetMeaning.structure}，解釋：${targetMeaning.meaning}），提供一個符合此用法的實用英文例句，並附上中文翻譯。請嚴格依照以下 JSON 格式回傳，不要有額外文字：\n{"en": "英文例句", "zh": "中文翻譯"}`;

                    try {
                        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${this.apiKey}`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                contents: [{ parts: [{ text: prompt }] }]
                            })
                        });

                        const data = await response.json();
                        if (data.candidates && data.candidates[0].content.parts[0].text) {
                            let text = data.candidates[0].content.parts[0].text;
                            text = text.replace(/```json/g, '').replace(/```/g, '').trim();
                            const result = JSON.parse(text);
                            targetMeaning.examples[eIndex].en = result.en;
                            targetMeaning.examples[eIndex].zh = result.zh;
                        } else {
                            alert('AI 回傳格式有誤，請重試一次。');
                        }
                    } catch (error) {
                        console.error(error);
                        alert('呼叫 Gemini API 發生錯誤，請檢查 API Key 是否正確。');
                    } finally {
                        this.isGenerating = false;
                    }
                },

                saveWord() {
                    if (!this.form.word.trim()) {
                        alert('請填寫英文單字/連接詞！');
                        return;
                    }
                    for (let m of this.form.meanings) {
                        if (!m.structure.trim() && !m.meaning.trim()) {
                            alert('所有含意欄位都必須填寫結構或中文解釋！');
                            return;
                        }
                    }

                    const today = new Date().toISOString().split('T')[0];

                    if (this.isEditing) {
                        const index = this.words.findIndex(w => w.id === this.editId);
                        if (index !== -1) {
                            this.words[index] = {
                                ...this.words[index],
                                ...this.form
                            };
                        }
                        this.isEditing = false;
                        this.editId = null;
                    } else {
                        const newEntry = {
                            id: Date.now(),
                            date: today,
                            ...this.form
                        };
                        this.words.unshift(newEntry);
                    }

                    this.syncStorage();
                    this.resetForm();
                    this.currentTab = 'list';
                },

                editWord(item) {
                    this.isEditing = true;
                    this.editId = item.id;
                    
                    let meanings = item.meanings ? JSON.parse(JSON.stringify(item.meanings)) : [{
                        pos: item.pos || 'conj. (連接詞)',
                        structure: item.meaning || '',
                        meaning: '',
                        examples: [{
                            en: item.exampleEn || '',
                            zh: item.exampleZh || ''
                        }]
                    }];

                    meanings = meanings.map(m => {
                        if (!m.examples) {
                            m.examples = [{ en: m.exampleEn || '', zh: m.exampleZh || '' }];
                        }
                        if (!m.structure && m.meaning) {
                            m.structure = m.meaning;
                            m.meaning = '';
                        }
                        return m;
                    });

                    this.form = {
                        word: item.word,
                        note: item.note || '',
                        meanings: meanings
                    };
                    this.currentTab = 'add';
                },

                deleteWord(id) {
                    if (confirm('確定要刪除這個項目嗎？')) {
                        this.words = this.words.filter(w => w.id !== id);
                        this.syncStorage();
                    }
                },

                resetForm() {
                    this.form = {
                        word: '',
                        note: '',
                        meanings: [
                            { 
                                pos: 'conj. (連接詞)', 
                                structure: '', 
                                meaning: '',
                                examples: [{ en: '', zh: '' }] 
                            }
                        ]
                    };
                },

                syncStorage() {
                    localStorage.setItem('vocab_words', JSON.stringify(this.words));
                },

                get groupedWords() {
                    return this.words.reduce((groups, word) => {
                        const date = word.date;
                        if (!groups[date]) {
                            groups[date] = [];
                        }
                        groups[date].push(word);
                        return groups;
                    }, {});
                }
            }
        }
    </script>
</body>
</html>
